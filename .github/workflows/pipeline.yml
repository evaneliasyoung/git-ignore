name: pipeline

env:
  ForcedZigVersion: 0.14.0

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{env.ForcedZigVersion}}

      - name: build
        run: zig build

      - name: test
        run: zig build test
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [windows, macos, linux]
        arch: [x86_64, aarch64]
        exclude:
          - os: windows
            arch: aarch64

    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{env.ForcedZigVersion}}

      - name: build
        run: zig build -Dtarget=${{matrix.arch}}-${{matrix.os}} -Doptimize=ReleaseSafe -Dexe_name=git-ignore-${{matrix.os}}-${{matrix.arch}}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{matrix.os}}-${{matrix.arch}}
          path: ./zig-out/git-ignore-${{matrix.os}}-${{matrix.arch}}*
